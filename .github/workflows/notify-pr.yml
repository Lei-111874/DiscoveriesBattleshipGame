name: Notify PR Assignee

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Comentar a notificar o responsável
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Tenta usar o(s) assignee(s); se não houver, usa o autor do PR
            let mentions = [];
            if (pr.assignees && pr.assignees.length > 0) {
              mentions = pr.assignees.map(a => `@${a.login}`);
            } else {
              mentions = [`@${pr.user.login}`];
            }

            const message = `🔔 ${mentions.join(', ')}, foi aberto o Pull Request **#${pr.number} - ${pr.title}**. Por favor verifica e trata deste PR.`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body: message
            });
